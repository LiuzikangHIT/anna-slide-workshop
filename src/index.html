<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>演示工坊</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./pptxgen.bundle.js" defer></script>
  <script src="./main.js" type="module"></script>
</head>
<body>
  <header class="topbar">
    <div class="masthead">
      <button id="home" class="brand" type="button"><span class="brand-mark" aria-hidden="true"></span>演示工坊</button>
      <span id="project"></span>
      <section id="anna-bar" class="anna-bar" aria-label="Anna 模型与用量" hidden>
        <div id="anna-controls" class="anna-controls"></div>
        <div id="anna-usage" class="anna-usage" role="status" aria-label="最近一次 Anna 请求"></div>
      </section>
      <div class="mast-actions">
        <span id="save" role="status">正在连接 Anna…</span>
        <button id="retry" hidden>重试保存</button>
        <button id="backup" hidden>草稿副本</button>
      </div>
    </div>
    <nav id="steps" class="steps" aria-label="演示制作步骤" hidden></nav>
  </header>
  <main id="workspace"></main>
  <div class="system-status" id="status" role="status" aria-live="polite" hidden></div>
  <dialog id="dialog"></dialog>
  <input id="import" type="file" accept=".json,application/json" hidden>
</body>
</html>
